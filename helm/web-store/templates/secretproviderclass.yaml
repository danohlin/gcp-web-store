{{- if .Values.secrets.enabled }}
{{- if not .Values.secrets.projectId }}
{{- fail "secrets.projectId is required when secrets.enabled is true" }}
{{- end }}
{{- if not .Values.secrets.prefix }}
{{- fail "secrets.prefix is required when secrets.enabled is true" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "web-store.secretProviderClassName" . }}
  labels:
    {{- include "web-store.labels" . | nindent 4 }}
spec:
  # The GKE managed Secret Manager component, not the upstream CSI driver. The
  # upstream driver cannot run on Autopilot at all — its DaemonSet needs
  # privileged write-mode hostPath mounts, which Autopilot forbids.
  provider: gke
  parameters:
    # Each entry becomes its own file named by `path`, which is exactly what
    # the backend's file-based config resolution expects. Terraform stores one
    # secret per value rather than a JSON document, because this provider has
    # no JMESPath equivalent to split one — see infra/ephemeral/secrets.tf.
    #
    # Because resourceName and path are independent, secret ids stay kebab-case
    # while the filenames keep the names the application reads.
    #
    # Nothing is synced to a Kubernetes Secret: the values stay on a tmpfs
    # mount, so they never reach etcd and never appear in `kubectl get secret`.
    # This provider has no sync-to-Secret option at all.
    secrets: |
      {{- range include "web-store.appSecretNames" . | fromJsonArray }}
      - resourceName: "projects/{{ $.Values.secrets.projectId }}/secrets/{{ $.Values.secrets.prefix }}-{{ . | lower | replace "_" "-" }}/versions/latest"
        path: {{ . | quote }}
      {{- end }}
{{- end }}
