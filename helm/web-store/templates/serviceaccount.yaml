{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "web-store.serviceAccountName" . }}
  labels:
    {{- include "web-store.labels" . | nindent 4 }}
# No cloud annotation here, unlike the IRSA version this replaces. Workload
# Identity Federation is on by default in Autopilot and the managed Secret
# Manager component authenticates as this service account directly, so IAM
# binds to a principal:// string naming this namespace and name — see
# infra/ephemeral/secrets.tf. Renaming either breaks secret access with an
# opaque PermissionDenied from the CSI driver.
automountServiceAccountToken: true
{{- end }}
