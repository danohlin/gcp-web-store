name: Version audit

# Every pinned external version in this repository is a hardcoded literal with
# no mechanism to notice when it goes stale. That gap has bitten before: on AWS
# the cluster sat four months past end of standard support, silently
# quadrupling the bill, and a vendored IAM policy drifted two majors behind its
# own chart, withholding a permission the Ingress depended on.
#
# Both of those specific traps are gone with the move to GKE — release channels
# auto-upgrade and there is no vendored policy — but the general problem is not,
# and two pins that previously had no watcher at all now do: the Postgres major,
# which is asserted to agree across three files, and Terraform core.
#
# This checks the pins against reality once a week and opens an issue when
# something needs attention. It is read-only and changes nothing.

on:
  schedule:
    # Monday morning, so anything found lands at the start of a week.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

env:
  REGION: us-central1

jobs:
  audit:
    name: Check pinned versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Read-only GCP access, needed for the GKE channel and Cloud SQL version
      # lookups. Uses the same service account as deploys; it can describe but
      # not create.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Audit
        id: audit
        run: |
          set -uo pipefail
          FINDINGS=""
          note() { FINDINGS="${FINDINGS}- $1"$'\n'; echo "::warning::$1"; }

          # An audit that silently extracts nothing reports "all clear" while
          # checking nothing, which is worse than not running. Every value below
          # is required to be non-empty and version-shaped, and the job fails
          # loudly if a pattern stops matching because a file was reformatted.
          require() {
            local name="$1" value="$2"
            if ! printf '%s' "$value" | grep -qE '^[0-9]+(\.[0-9]+)+$'; then
              echo "::error::Could not extract ${name} (got '${value}'). A pattern in this workflow no longer matches the source file."
              exit 1
            fi
          }

          # ---------------------------------------------------------------
          # Does the Kubernetes version CI validates against still match what
          # the cluster's release channel actually serves?
          #
          # The EKS check this replaces was about cost: a version past end of
          # standard support quadrupled the control plane bill. GKE channels
          # auto-upgrade, so that cannot happen. What can happen is quieter —
          # kubeconform keeps validating against an API version the cluster no
          # longer runs, so a manifest passes CI and fails on apply.
          # ---------------------------------------------------------------
          CI_K8S=$(grep -m1 -oE '\-kubernetes-version [0-9]+\.[0-9]+\.[0-9]+' .github/workflows/ci.yml \
                   | sed -E 's/.* //')
          require 'the kubeconform Kubernetes version' "$CI_K8S"

          # Anchored to the assignment. An unanchored grep for 'default' matches
          # the description heredoc above it, which uses the word in prose —
          # it yielded a whole sentence rather than REGULAR.
          CHANNEL=$(awk '/variable "release_channel"/,/^}/' infra/ephemeral/variables.tf \
                    | grep -m1 -E '^\s*default\s*=' | sed -E 's/.*"([A-Z]+)".*/\1/')
          if [ -z "$CHANNEL" ]; then
            echo "::error::Could not extract the release channel from infra/ephemeral/variables.tf."
            exit 1
          fi

          SERVER_DEFAULT=$(gcloud container get-server-config --region "$REGION" --format=json 2>/dev/null \
                           | jq -r --arg ch "$CHANNEL" '.channels[] | select(.channel == $ch) | .defaultVersion' \
                           | sed -E 's/-gke.*//')
          echo "kubeconform=$CI_K8S channel=$CHANNEL server default=$SERVER_DEFAULT"
          if [ -n "$SERVER_DEFAULT" ]; then
            # Compare major.minor only; the patch moves constantly and is not
            # worth an issue every week.
            if [ "${CI_K8S%.*}" != "${SERVER_DEFAULT%.*}" ]; then
              note "CI validates manifests against Kubernetes ${CI_K8S}, but the ${CHANNEL} channel now serves ${SERVER_DEFAULT}. Fix: \`-kubernetes-version\` in \`.github/workflows/ci.yml\`."
            fi
          fi

          # ---------------------------------------------------------------
          # Postgres major: three files must agree.
          #
          # This drifted unnoticed on AWS — RDS ran 16 while CI tested against
          # 17 — because nothing compared them. Tests passing against a
          # different major than production runs is exactly the sort of thing
          # that surfaces as an inexplicable production-only bug.
          # ---------------------------------------------------------------
          TF_PG=$(awk '/variable "db_database_version"/,/^}/' infra/ephemeral/variables.tf \
                  | grep -m1 -E '^\s*default\s*=' | sed -E 's/.*POSTGRES_([0-9]+).*/\1/')
          CI_PG=$(grep -m1 -oE 'image: postgres:[0-9]+' .github/workflows/ci.yml | sed -E 's/.*://')
          COMPOSE_PG=$(grep -m1 -oE 'image: postgres:[0-9]+' docker-compose.yml | sed -E 's/.*://')

          for pair in "Cloud SQL:$TF_PG" "ci.yml:$CI_PG" "docker-compose.yml:$COMPOSE_PG"; do
            if ! printf '%s' "${pair#*:}" | grep -qE '^[0-9]+$'; then
              echo "::error::Could not extract the Postgres major from ${pair%%:*}. A pattern in this workflow no longer matches."
              exit 1
            fi
          done

          echo "postgres cloudsql=$TF_PG ci=$CI_PG compose=$COMPOSE_PG"
          if [ "$TF_PG" != "$CI_PG" ] || [ "$TF_PG" != "$COMPOSE_PG" ]; then
            note "**Postgres majors disagree**: Cloud SQL ${TF_PG}, ci.yml ${CI_PG}, docker-compose.yml ${COMPOSE_PG}. Tests are not running against the engine production uses."
          fi

          # Is the pinned major still offered by Cloud SQL?
          if ! gcloud sql flags list --format='value(appliesTo)' 2>/dev/null | tr ',' '\n' | grep -q "POSTGRES_${TF_PG}"; then
            note "Cloud SQL no longer lists POSTGRES_${TF_PG} as a supported version. A create would fail after the network and cluster have already been built."
          fi

          # ---------------------------------------------------------------
          # Terraform: provider major, and the core version CI installs
          # ---------------------------------------------------------------
          PROV_PIN=$(grep -m1 -A1 'hashicorp/google' infra/ephemeral/versions.tf | grep version | sed -E 's/.*~> ([0-9.]+).*/\1/')
          require 'the Google provider constraint' "$PROV_PIN"
          PROV_LATEST=$(curl -s https://registry.terraform.io/v1/providers/hashicorp/google | jq -r '.version // empty')
          echo "google provider pin=$PROV_PIN latest=$PROV_LATEST"
          if [ -n "$PROV_LATEST" ] && [ "${PROV_PIN%%.*}" != "${PROV_LATEST%%.*}" ]; then
            note "Terraform Google provider is constrained to ~> ${PROV_PIN}; ${PROV_LATEST} is a newer major. HashiCorp concentrates fixes on the current major."
          fi

          TF_CI=$(grep -m1 -oE 'terraform_version: [0-9]+\.[0-9]+\.[0-9]+' .github/workflows/ci.yml | sed -E 's/.* //')
          require 'the Terraform version CI installs' "$TF_CI"
          TF_LATEST=$(curl -s https://api.github.com/repos/hashicorp/terraform/releases/latest | jq -r '.tag_name' | tr -d 'v')
          echo "terraform ci=$TF_CI latest=$TF_LATEST"
          if [ -n "$TF_LATEST" ] && [ "${TF_CI%.*}" != "${TF_LATEST%.*}" ]; then
            note "CI installs Terraform ${TF_CI}; ${TF_LATEST} is current. \`terraform validate\` is only as good as the version running it."
          fi

          # ---------------------------------------------------------------
          # kubeconform, which validates every manifest in this repository
          # ---------------------------------------------------------------
          KC_PIN=$(grep -m1 -oE 'kubeconform/releases/download/v[0-9.]+' .github/workflows/ci.yml | sed -E 's/.*v//')
          require 'the kubeconform pin' "$KC_PIN"
          KC_LATEST=$(curl -s https://api.github.com/repos/yannh/kubeconform/releases/latest | jq -r '.tag_name' | tr -d 'v')
          echo "kubeconform pin=$KC_PIN latest=$KC_LATEST"
          if [ -n "$KC_LATEST" ] && [ "$KC_PIN" != "$KC_LATEST" ]; then
            note "kubeconform is pinned at ${KC_PIN}; ${KC_LATEST} is available. Newer releases carry newer Kubernetes schemas."
          fi

          # ---------------------------------------------------------------
          # nginx base image — the one component facing the internet
          # ---------------------------------------------------------------
          NGINX_PIN=$(grep -m1 'FROM nginxinc/nginx-unprivileged' frontend/Dockerfile | sed -E 's/.*:([0-9.]+)-alpine.*/\1/')
          require 'the nginx pin' "$NGINX_PIN"
          NGINX_LATEST=$(curl -s 'https://hub.docker.com/v2/repositories/nginxinc/nginx-unprivileged/tags?page_size=100&name=-alpine' \
                         | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+-alpine$' | sed 's/-alpine//' | sort -V | tail -1)
          echo "nginx pin=$NGINX_PIN latest=$NGINX_LATEST"
          if [ -n "$NGINX_LATEST" ] && [ "$NGINX_PIN" != "$NGINX_LATEST" ]; then
            note "nginx is pinned at ${NGINX_PIN}; ${NGINX_LATEST} is available. It is the only internet-facing component, so security fixes matter."
          fi

          # ---------------------------------------------------------------
          {
            echo "findings<<EOF"
            echo "$FINDINGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FINDINGS" ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            echo "::notice::All pinned versions are current."
          fi

      - name: Open or update an issue
        if: steps.audit.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDINGS: ${{ steps.audit.outputs.findings }}
        run: |
          set -euo pipefail
          TITLE="Pinned versions need attention"
          BODY=$(printf '%s\n\n%s\n\n%s\n' \
            "The weekly version audit found the following. Each was checked against upstream, not inferred." \
            "$FINDINGS" \
            "_Raised by [\`version-audit.yml\`](../blob/main/.github/workflows/version-audit.yml). Re-run it after fixing to close this out._")

          # Reuse the open issue rather than filing a new one every Monday.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label dependencies 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Version audit"
            echo ""
            if [ "${{ steps.audit.outputs.has_findings }}" = "true" ]; then
              echo "${{ steps.audit.outputs.findings }}"
            else
              echo "All pinned versions are current."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
