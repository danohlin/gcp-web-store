{{- if .Values.ingress.enabled }}
{{- $fullName := include "web-store.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "web-store.labels" . | nindent 4 }}
  annotations:
    # The GKE Ingress controller provisions an external Application Load
    # Balancer out of band. Nothing in Terraform knows about it, which is why
    # the teardown order in scripts/down.ps1 matters — see NOTES.txt.
    #
    # Health checks are not configured here as they were with the ALB
    # annotations. Container-native load balancing derives them from the
    # backend Service's BackendConfig instead; see backendconfig.yaml.
    {{- if .Values.ingress.managedCertificateName }}
    networking.gke.io/managed-certificates: {{ .Values.ingress.managedCertificateName | quote }}
    {{- else }}
    # No certificate configured, so the load balancer serves plain HTTP on its
    # raw IP. Set ingress.managedCertificateName (and a domain) to enable TLS —
    # and only then set app.cookieSecure.
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          # Order is cosmetic here. Google Cloud Load Balancing URL maps match
          # by longest prefix, so /api wins over / regardless of position. The
          # ALB this replaced evaluated rules in order, which made the ordering
          # load-bearing and made SetRulePriorities a permission the controller
          # had to hold.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-frontend
                port:
                  number: 80
{{- end }}
