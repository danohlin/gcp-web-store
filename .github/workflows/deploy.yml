name: Deploy

# Only from main, matching the Workload Identity provider's attribute_condition.
# A run from any other ref cannot impersonate the service account, so this would
# fail at the auth step.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: false
        default: dev

permissions:
  # Required for GitHub to mint the OIDC token. Without it the auth step fails
  # with "GitHub Actions did not inject the token".
  id-token: write
  contents: read

concurrency:
  # Never let two deploys race for the same cluster; queue instead of cancelling
  # so a half-applied release is not abandoned mid-rollout.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # No project id here on purpose: it is an account identifier and this
  # repository is public. It comes from the auth step's output at runtime, the
  # same way the AWS account id used to come from sts get-caller-identity.
  REGION: us-central1
  PROJECT: web-store
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No service account keys anywhere. GitHub mints a short-lived token, GCP
      # trades it for an impersonated access token, and it expires when the job
      # ends.
      #
      # Impersonation rather than direct federation: federated principalSet
      # tokens are capped at ten minutes and are not accepted by every GCP API.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Resolve names
        id: names
        run: |
          set -euo pipefail
          # Extracted by the auth step from the service account email. If that
          # ever fails it comes back empty, and every image tag below would
          # silently become <region>-docker.pkg.dev//web-store/... — a push to a
          # malformed path, failing somewhere far less obvious than here.
          PROJECT_ID='${{ steps.auth.outputs.project_id }}'
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::The auth step returned no project_id. Set project_id explicitly on google-github-actions/auth."
            exit 1
          fi
          REGISTRY="${REGION}-docker.pkg.dev/${PROJECT_ID}/${PROJECT}"
          # Every name is derived from the naming convention rather than read
          # from Terraform state. CI therefore needs no access to that state,
          # which holds the database password in plaintext.
          {
            echo "project_id=${PROJECT_ID}"
            echo "registry=${REGISTRY}"
            echo "cluster=${PROJECT}-${ENVIRONMENT}"
            echo "namespace=${PROJECT}"
            echo "secret_prefix=${PROJECT}-${ENVIRONMENT}"
            echo "tag=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      # Installs a docker credential helper, so the subsequent pushes
      # authenticate transparently. No token piping, and no password on a
      # command line.
      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: runtime
          push: true
          # See scripts/up.ps1 for why attestations are off.
          provenance: false
          tags: ${{ steps.names.outputs.registry }}/backend:${{ steps.names.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: migrator
          push: true
          # See scripts/up.ps1 for why attestations are off.
          provenance: false
          tags: ${{ steps.names.outputs.registry }}/migrator:${{ steps.names.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          # See scripts/up.ps1 for why attestations are off.
          provenance: false
          tags: ${{ steps.names.outputs.registry }}/frontend:${{ steps.names.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The environment is torn down nightly, so a deploy may well find no
      # cluster. That is expected, not a failure: the images are pushed and
      # waiting for the next `up.ps1`.
      - name: Is the cluster up?
        id: cluster
        run: |
          if gcloud container clusters describe "${{ steps.names.outputs.cluster }}" \
               --region "$REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cluster ${{ steps.names.outputs.cluster }} is not running. Images pushed; skipping deploy."
          fi

      - uses: azure/setup-helm@v5
        if: steps.cluster.outputs.exists == 'true'

      - name: Configure kubectl
        if: steps.cluster.outputs.exists == 'true'
        uses: google-github-actions/get-gke-credentials@v3.0.0
        with:
          cluster_name: ${{ steps.names.outputs.cluster }}
          location: ${{ env.REGION }}

      - name: Deploy
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -euo pipefail
          helm upgrade --install "$PROJECT" ./helm/web-store \
            --namespace "${{ steps.names.outputs.namespace }}" \
            --create-namespace \
            -f ./helm/web-store/values-dev.yaml \
            --set "backend.image.repository=${{ steps.names.outputs.registry }}/backend" \
            --set backend.image.tag=${{ steps.names.outputs.tag }} \
            --set "frontend.image.repository=${{ steps.names.outputs.registry }}/frontend" \
            --set frontend.image.tag=${{ steps.names.outputs.tag }} \
            --set "migration.image.repository=${{ steps.names.outputs.registry }}/migrator" \
            --set migration.image.tag=${{ steps.names.outputs.tag }} \
            --set secrets.projectId=${{ steps.names.outputs.project_id }} \
            --set secrets.prefix=${{ steps.names.outputs.secret_prefix }} \
            --wait --timeout 15m

      # The migration hook runs before the pods roll, so when a deploy fails it
      # is usually the Job that explains why. Surface it rather than making
      # someone go and find it.
      - name: Migration logs on failure
        if: failure() && steps.cluster.outputs.exists == 'true'
        run: |
          kubectl logs -n "${{ steps.names.outputs.namespace }}" \
            -l app.kubernetes.io/component=migrate --tail=100 || true
          kubectl get pods -n "${{ steps.names.outputs.namespace }}" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${{ steps.names.outputs.tag }}\` |"
            echo "| Cluster | \`${{ steps.names.outputs.cluster }}\` |"
            if [ "${{ steps.cluster.outputs.exists }}" = "true" ]; then
              # .ip, not .hostname. A Google Cloud load balancer publishes an
              # address; only an ALB populates hostname.
              ADDR=$(kubectl get ingress "$PROJECT" -n "${{ steps.names.outputs.namespace }}" \
                     -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
              echo "| URL | http://${ADDR:-pending} |"
            else
              echo "| Status | Cluster down - images pushed, deploy skipped |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
