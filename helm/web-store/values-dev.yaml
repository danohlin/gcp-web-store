# Throwaway environment: created in the morning, destroyed at the end of the
# day. Sized down accordingly, and reseeded on every deploy.
#
# Image repositories and the secret project/prefix come from Terraform outputs;
# the up script fills them in. Image tags come from CI.

backend:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi

frontend:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    # Autopilot enforces a floor of 50m CPU and 52Mi memory per container, and a
    # memory:CPU ratio of at least 1:1. The previous 10m/32Mi breached both, so
    # Autopilot silently rewrote them — these values are what actually gets
    # scheduled, and are stated explicitly so the manifest tells the truth.
    #
    # Verified on a real cluster: pods are admitted with exactly these numbers,
    # and a memory limit above the request is honoured rather than being clamped
    # up to it — so this runs on the container-optimized compute platform, where
    # bursting is allowed. Billing is still on the request.
    requests:
      cpu: 50m
      memory: 52Mi
    limits:
      memory: 96Mi

app:
  logLevel: debug
  # No certificate on the load balancer's raw IP, so cookies cannot be Secure.
  cookieSecure: false

migration:
  seed: true

# A single replica cannot satisfy minAvailable: 1 and still be evictable, which
# would block node drains and stall a teardown.
podDisruptionBudget:
  enabled: false

# Spot Pods: 60-91% cheaper, and correct for an environment rebuilt daily.
#
# This applies to the Deployments only. The migration Job has its own
# migration.nodeSelector, left empty on purpose — see migration.yaml.
#
# Autopilot manages system workloads itself, so the CoreDNS-stuck-Pending
# failure that forced the spot taint out of the EKS stack has no counterpart
# here and no toleration is needed. What does carry over is the eviction
# window: Spot Pods get 25 seconds' notice.
#
# Setting this selector also silently shortens the grace period. Autopilot
# caps terminationGracePeriodSeconds at 25 for any pod tolerating Spot and
# rewrites anything higher on admission, so the 30 the Deployments ask for
# never takes effect here. Verified on a real cluster — the admitted pods
# report 25 — and announced only as an admission warning in the helm output,
# which scrolls past.
#
# It costs nothing today because the server force-exits at 15s regardless. It
# would start to matter if shutdown ever grew slower than 25 seconds, and the
# symptom would be pods killed mid-drain with the manifest still claiming 30.
nodeSelector:
  cloud.google.com/gke-spot: 'true'

tolerations: []
