name: Secret scan

# TruffleHog complements the local gitleaks pre-commit hook rather than
# duplicating it. gitleaks is fast pattern/entropy matching, run locally as a
# blocking gate. TruffleHog calls the provider APIs to check whether a
# candidate is a *live* credential -- too slow and too network-dependent for a
# commit hook, but the right thing in CI.
#
# --results=verified means this job only fails on secrets confirmed active
# against the issuing provider, so a red build here is never noise.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Mondays 06:00 UTC. Catches credentials that were committed while
    # inert and later became live, and picks up new TruffleHog detectors.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A later push supersedes an in-flight scan of the same ref.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          # Needed by the scheduled and manual runs, which scan all history: a
          # secret is a leak from the commit that introduced it, even if a
          # later commit removed it. (Push and PR runs only scan their own
          # commit range, which is the point -- those stay fast.)
          fetch-depth: 0

      - name: Scan
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          # Pins the scanner itself. The action tag above only pins the wrapper
          # script; this input defaults to "latest", so without it the actual
          # detector floats. No leading "v" -- ghcr publishes 3.96.0.
          version: 3.96.0
          # The action's own docker invocation already passes --fail. Repeating
          # it is a hard error: "flag 'fail' cannot be repeated".
          extra_args: --results=verified
